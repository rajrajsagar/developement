name: AIOps Autonomous Code Remediation Pipeline

on:
  pull_request:
    paths:
      - 'demo/**'
    branches:
      - main

jobs:
  code-remediation-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Checkov
        run: |
          python3 -m pip install --upgrade pip
          pip install checkov

      # 1. EVALUATE COMPLIANCE STATE
      - name: Run Initial Checkov Scan
        id: run_scan
        continue-on-error: true 
        run: |
          echo "=== Starting AIOps Code Analysis Gate ==="
          checkov -d . --soft-fail > checkov_report.json || true
          VIOLATIONS=$(grep -c "FAILED for resource" checkov_report.json || echo "0")
          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "======================================================="
          echo "📊 AIOps Pipeline Metrics Collected!"
          echo "Actionable Security Vulnerabilities Found: $VIOLATIONS"
          echo "======================================================="

      # 2. PROVISION KIRO CORE ENGINE
      - name: Install AWS Kiro CLI
        if: steps.run_scan.outputs.violations > 0
        run: |
          echo "=== Provisioning Agentic AIOps Engine ==="
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.kiro/bin" >> $GITHUB_PATH

      # 3. INTERACTIVE CLASSROOM GATEWAY: DEVICE FLOW LOGIN
      - name: Interactive Live AIOps Authentication
        if: steps.run_scan.outputs.violations > 0
        timeout-minutes: 5 
        run: |
          echo "=========================================================================="
          echo "🚨 ATTENTION INSTRUCTOR / STUDENTS: LIVE OAUTH APPROVAL REQUIRED 🚨"
          echo "=========================================================================="
          
          export PATH="$HOME/.kiro/bin:$PATH"
          
          # Simulate menu arrow selection by piping keystroke bindings into the background runner
          echo -e "\x1B[B\x1B[B\n" | script -q -c "kiro-cli login --use-device-flow" kiro_login_output.log &
          
          echo "Waiting 15 seconds for Kiro to process the menu and generate your unique link..."
          sleep 15
          
          echo "=========================================================================="
          echo "👉 REFRESH/VIEW LOG DETAIL BELOW FOR YOUR DEVICE CODE 👈"
          echo "=========================================================================="
          cat kiro_login_output.log || true
          echo "=========================================================================="
          
          # ⏳ Waking loop: Checks the actual runtime data directory where Kiro locks state keys!
          for i in {1..60}; do
            if [ -d "$HOME/.local/share/kiro-cli" ] || [ -d "$HOME/.kiro" ]; then
               echo "✅ Live Authentication Verification Success! Continuing pipeline..."
               break
            fi
            sleep 5
          done

      # 4. RUN HEADLESS REMEDIATION UNDER FRESH ACTIVE AUTHENTICATED STATE
      - name: Run Headless Kiro Auto-Patch Engine
        if: steps.run_scan.outputs.violations > 0
        run: |
          echo "=== Initiating Autonomous Infrastructure Patching ==="
          export PATH="$HOME/.kiro/bin:$PATH"
          
          # Route environment mappings directly into the active session workspace keys
          HOME="$HOME" kiro-cli chat \
            --trust-all-tools \
            --no-interactive \
            "Review the infrastructure vulnerabilities logged in checkov_report.json. Apply the exact HCL fixes to main.tf matching the structural requirements outlined in the file ../.kiro/security-guardrails.md."

      # 5. COMMIT CLEAN CODE BACK TO PR
      - name: Commit & Push Patches to PR Branch
        if: steps.run_scan.outputs.violations > 0
        run: |
          git config --global user.name "wezvatech-aiops-bot"
          git config --global user.email "aiops-engine@wezvatech.com"
          git add .
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "security(ops): autonomous compliance patch applied via AWS Kiro"
            git push origin HEAD:${{ github.head_ref }}
          fi

      # 6. POST COMMENT TO PR SO THE USER IS INFORMED
      - name: Post Status Comment on Pull Request
        if: steps.run_scan.outputs.violations > 0
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 AIOps Remediation Alert\n\n⚠️ **Checkov** flagged \`${{ steps.run_scan.outputs.violations }}\` compliance issues.\n🔧 **AWS Kiro** has autonomously refactored your HCL code templates to match corporate security guardrails.\n✅ Clean code has been pushed. The pipeline will now re-verify and pass.`
            })

      # 7. STRICT FINAL VERIFICATION PASS (Ensures PR turns Green if Kiro fixed it)
      - name: Run Final Validation Scan
        run: |
          terraform init
          terraform validate
          checkov -d .
