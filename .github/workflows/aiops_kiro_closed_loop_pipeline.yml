name: AIOps Autonomous Code Remediation Pipeline

on:
  pull_request:
    paths:
      - 'demo/**'
    branches:
      - main

jobs:
  code-remediation-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Checkov
        run: |
          python3 -m pip install --upgrade pip
          pip install checkov

      # 1. EVALUATE COMPLIANCE STATE
      - name: Run Initial Checkov Scan
        id: run_scan
        # continue-on-error guarantees that any JSON rendering quirks will never crash the runner
        continue-on-error: true 
        run: |
          echo "=== Starting AIOps Code Analysis Gate ==="
          
          # Run standard checkov scan. We save the regular CLI text report for the Kiro engine.
          # We use || true to force a clean exit status so the bash environment continues smoothly.
          checkov -d . --soft-fail > checkov_report.json || true
          
          # Count how many times the word "FAILED" appears in the structural text output
          VIOLATIONS=$(grep -c "FAILED for resource" checkov_report.json || echo "0")
          
          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "======================================================="
          echo "📊 AIOps Pipeline Metrics Collected!"
          echo "Actionable Security Vulnerabilities Found: $VIOLATIONS"
          echo "======================================================="

      # 2. IF VIOLATIONS EXIST, NOTIFY USER & EXECUTE KIRO
      - name: Install AWS Kiro CLI
        if: steps.run_scan.outputs.violations > 0
        run: |
          echo "=== Provisioning Agentic AIOps Engine ==="
          curl -fsSL https://cli.kiro.dev/install | bash
          
          # Force set binary location straight to system environment variables path
          echo "$HOME/.kiro/bin" >> $GITHUB_PATH
          echo "Kiro CLI installation stream deployed."

      - name: Hydrate Free Tier Session State
        if: steps.run_scan.outputs.violations > 0
        env:
          SESSION_DATA: ${{ secrets.KIRO_SESSION_DATA }}
        run: |
          echo "=== Hydrating Authenticated Session State ==="
          
          # 1. Unpack to the current home directory
          echo "$SESSION_DATA" | base64 --decode | tar -xzf - -C "$HOME"
          
          # 2. Diagnostic Print: Show exactly where the files landed
          echo "--- Directory Structure Debug ---"
          echo "Home directory contents:"
          ls -la "$HOME"
          echo "Config folder contents:"
          ls -la "$HOME/.config" || echo ".config folder missing"
          
          # 3. Create a safety mirror: Copy session files into BOTH possible directories
          # so Kiro CLI will find them no matter which directory it looks in!
          if [ -d "$HOME/.config/kiro-cli" ]; then
             cp -r "$HOME/.config/kiro-cli" "$HOME/.kiro" 2>/dev/null || true
          fi
          if [ -d "$HOME/.kiro" ]; then
             mkdir -p "$HOME/.config"
             cp -r "$HOME/.kiro" "$HOME/.config/kiro-cli" 2>/dev/null || true
          fi
          
          echo "Headless pipeline session hydrated and mirrored successfully."

          
      - name: Run Headless Kiro Auto-Patch Engine
        if: steps.run_scan.outputs.violations > 0
        run: |
          echo "=== Initiating Autonomous Infrastructure Patching ==="
          kiro-cli chat \
            --trust-all-tools \
            --no-interactive \
            "Review the infrastructure vulnerabilities logged in checkov_report.json. Apply the exact HCL fixes to demo/main.tf matching the structural requirements outlined in the file ../.kiro/security-guardrails.md."
         
      # 3. COMMIT CLEAN CODE BACK TO PR
      - name: Commit & Push Patches to PR Branch
        if: steps.run_scan.outputs.violations > 0
        run: |
          git config --global user.name "wezvatech-aiops-bot"
          git config --global user.email "aiops-engine@wezvatech.com"
          git add .

          # Only commit if changes were actually made by Kiro
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "security(ops): autonomous compliance patch applied via AWS Kiro"
            git push origin HEAD:${{ github.head_ref }}
          fi

      # 4. POST COMMENT TO PR SO THE USER IS INFORMED
      - name: Post Status Comment on Pull Request
        if: steps.run_scan.outputs.violations > 0
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 AIOps Remediation Alert\n\n⚠️ **Checkov** flagged \`${{ steps.run_scan.outputs.violations }}\` compliance issues.\n🔧 **AWS Kiro** has autonomously refactored your HCL code templates to match corporate security guardrails.\n✅ Clean code has been pushed. The pipeline will now re-verify and pass.`
            })

      # 5. STRICT FINAL VERIFICATION PASS (Ensures PR turns Green if Kiro fixed it)
      - name: Run Final Validation Scan
        run: |
          terraform init
          terraform validate
          # Run checkov without --soft-fail this time. If Kiro fixed it, this step returns exit code 0 (Success)
          checkov -d .
