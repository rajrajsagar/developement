name: AIOps Autonomous Code Remediation Pipeline

on:
  pull_request:
    types: [opened, edited] # 🔑 FIXED: Removed synchronize to prevent PR loop re-triggers
    paths:
      - 'demo/**'
    branches:
      - main

jobs:
  code-remediation-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
        
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Checkov
        run: |
          python3 -m pip install --upgrade pip
          pip install checkov

      # 1. EVALUATE COMPLIANCE STATE
      - name: Run Initial Checkov Scan
        id: run_scan
        continue-on-error: true 
        run: |
          echo "=== Starting AIOps Code Analysis Gate ==="
          checkov -d . --soft-fail --output json > checkov_report.json 2>/dev/null || true
          
          # Compute count cleanly from the generated JSON report asset
          VIOLATIONS_COUNT=$(grep -c '"failed_checks"' checkov_report.json || echo "0")
          
          echo "======================================================="
          echo "📊 AIOps Pipeline Metrics Collected!"
          echo "Actionable Security Vulnerabilities Found: $VIOLATIONS_COUNT"
          echo "======================================================="
          
          # Safe multiline environment block
          echo "violations<<EOF" >> "$GITHUB_OUTPUT"
          echo "$VIOLATIONS_COUNT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # 2. PROVISION KIRO CORE ENGINE
      - name: Install AWS Kiro CLI
        if: steps.run_scan.outputs.violations > 0
        run: |
          echo "=== Provisioning Agentic AIOps Engine ==="
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.kiro/bin" >> $GITHUB_PATH

      # 3. INTERACTIVE CLASSROOM GATEWAY: DEVICE FLOW LOGIN
      - name: Interactive Live AIOps Authentication
        if: steps.run_scan.outputs.violations > 0
        timeout-minutes: 5 
        run: |
          echo "=========================================================================="
          echo "🚨 ATTENTION INSTRUCTOR / STUDENTS: LIVE OAUTH APPROVAL REQUIRED 🚨"
          echo "=========================================================================="
          
          export PATH="$HOME/.kiro/bin:$PATH"
          
          echo -e "\x1B[B\x1B[B\n" | /usr/bin/script -q -c "kiro-cli login --use-device-flow" kiro_login_output.log &
          LOGIN_PID=$!
          
          echo "Waiting 15 seconds for Kiro to process the menu and generate your unique link..."
          /usr/bin/sleep 15
          
          echo "=========================================================================="
          echo "👉 REFRESH/VIEW LOG DETAIL BELOW FOR YOUR DEVICE CODE 👈"
          echo "=========================================================================="
          cat kiro_login_output.log || true
          echo "=========================================================================="
          
          echo "Watching for active browser authorization event..."
          for i in {1..60}; do
            if grep -q "Signed in with GitHub" kiro_login_output.log; then
               echo "=========================================================================="
               echo "✅ SUCCESS: Live Authentication Captured! Terminating background screen lock..."
               echo "=========================================================================="
               kill -9 $LOGIN_PID 2>/dev/null || true
               break
            fi
            /usr/bin/sleep 5
          done
          
          echo "Continuing pipeline execution under fully authenticated session state..."

      # 4. RUN HEADLESS REMEDIATION UNDER FRESH ACTIVE AUTHENTICATED STATE
      - name: Run Headless Kiro Auto-Patch Engine
        if: steps.run_scan.outputs.violations > 0
        run: |
          echo "=== Initiating Autonomous Infrastructure Patching ==="
          export PATH="$HOME/.kiro/bin:$PATH"
          
          kiro-cli chat \
            --trust-all-tools \
            --no-interactive \
            "Review the infrastructure vulnerabilities logged in checkov_report.json. Apply the exact HCL fixes to main.tf matching the structural requirements outlined in the file ../.kiro/security-guardrails.md by enabling encryption, setting encrypted to true and mapping the associated KMS Key ARN properly."

      # 5. COMMIT CLEAN CODE BACK TO PR
      - name: Commit & Push Patches to PR Branch
        if: steps.run_scan.outputs.violations > 0
        run: |
          git config --global user.name "wezvatech-aiops-bot"
          git config --global user.email "aiops-engine@wezvatech.com"
          
          # 🔑 FIXED: Target only HCL config files. Do NOT add internal system/json logs!
          git add *.tf

          if ! git diff --quiet || ! git diff --staged --quiet; then
            # 🔑 FIXED: Appended [skip ci] tag to tell GitHub to skip running the dev pipeline on this push
            git commit -m "security(ops): autonomous compliance patch applied via AWS Kiro [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      # 6. POST COMMENT TO PR SO THE USER IS INFORMED
      - name: Post Status Comment on Pull Request
        if: steps.run_scan.outputs.violations > 0
        uses: actions/github-script@v7
        with:
          script: |
            var totalViolations = '${{ steps.run_scan.outputs.violations }}';
            var commentBody = '### 🤖 AIOps Remediation Alert\n\n' +
                              '⚠️ **Checkov** flagged `' + totalViolations + '` compliance issues.\n' +
                              '🔧 **AWS Kiro** has autonomously refactored your HCL code templates to match corporate security guardrails.\n' +
                              '✅ Clean code has been pushed. The pipeline will now re-verify and pass.';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            })


      # 7. STRICT FINAL VERIFICATION PASS (Ensures PR turns Green if Kiro fixed it)
      - name: Run Final Validation Scan
        if: steps.run_scan.outputs.violations > 0
        run: |
          terraform init
          terraform validate
          # 🔑 FIXED: Safe workspace teardown of memory assets before executing code evaluations
          rm -f checkov_report.json kiro_login_output.log
          checkov -d . --skip-path .terraform

